name: obscura
title: OBSCura
summary: Unofficial control panel for OBSBOT webcams
description: |
  Configure OBSBOT webcams on Linux: AI tracking (human, group, hand),
  gesture control, gimbal joystick, mirror image, and image settings such as
  focus, exposure and white balance, with a live preview.

  Settings are written to the camera itself, so they apply in every app that
  uses it. Also includes the `obscura.obsbotctl` command-line tool.

  Supported: OBSBOT Tiny SE. Other OBSBOT models get the standard webcam
  controls. Not affiliated with OBSBOT / Remo Tech.

  After installing, connect the camera interface:

    sudo snap connect obscura:camera

  Optionally, to show the camera's USB product name, serial number and
  revision in the Device panel:

    sudo snap connect obscura:hardware-observe

  To call the CLI as plain `obsbotctl`:

    sudo snap alias obscura.obsbotctl obsbotctl
license: GPL-3.0-or-later
website: https://github.com/kenvandine/obscura
source-code: https://github.com/kenvandine/obscura
issues: https://github.com/kenvandine/obscura/issues
contact: https://github.com/kenvandine/obscura/issues
icon: snap/local/obscura.png
adopt-info: obscura

base: core24
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  obscura:
    command: bin/obscura
    desktop: usr/share/applications/obscura.desktop
    common-id: io.github.kenvandine.obscura
    extensions: [gnome]
    plugs:
      - camera

  obsbotctl:
    command: bin/obsbotctl
    plugs:
      - camera

parts:
  obscura:
    plugin: nil
    # Build from committed files only; keeps target/ and node_modules out.
    source: .
    source-type: git
    build-snaps:
      - rustup
      - node/22/stable
    build-packages:
      - build-essential
      - clang          # bindgen in v4l2-sys-mit (preview capture)
      - libclang-dev
      - pkg-config
      - libssl-dev
      - librsvg2-dev
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)+git$(git rev-parse --short HEAD)"
    override-build: |
      set -eux
      # The gnome extension points LD_LIBRARY_PATH at the SDK's libc, which
      # breaks every host tool run during the build (rustup, node, cargo
      # build scripts). Keep its PKG_CONFIG_PATH so we compile against the
      # same WebKitGTK/GTK the runtime ships, and give the linker the SDK
      # library dirs via -rpath-link instead.
      unset LD_LIBRARY_PATH
      SDK_LIBS="$SNAPCRAFT_GNOME_SDK/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAPCRAFT_GNOME_SDK/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      export RUSTFLAGS="-C link-arg=-Wl,-rpath-link,$SDK_LIBS"
      rustup toolchain install stable --profile minimal
      rustup default stable

      # pnpm must be on PATH: tauri's beforeBuildCommand runs `pnpm build`.
      npm install --prefix "$CRAFT_PART_BUILD/.tools" pnpm@10
      export PATH="$CRAFT_PART_BUILD/.tools/node_modules/.bin:$PATH"

      cd app
      pnpm install --frozen-lockfile
      pnpm tauri build --no-bundle
      cd ..
      cargo build --release --locked -p obsbotctl

      install -Dm755 target/release/obscura "$CRAFT_PART_INSTALL/bin/obscura"
      install -Dm755 target/release/obsbotctl "$CRAFT_PART_INSTALL/bin/obsbotctl"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/obscura/copyright"
      install -Dm644 snap/local/obscura.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/obscura.desktop"
      install -Dm644 snap/local/obscura.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/obscura.png"
