[workspace]
resolver = "2"
members = ["crates/obsbot-core", "crates/obsbotctl", "crates/obscura-indicator", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Ken VanDine <kvandine@gmail.com>"]

[workspace.dependencies]
obsbot-core = { path = "crates/obsbot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
