[package]
name = "obscura-indicator"
description = "Lightweight tray indicator for OBSCura: quick AI controls and show/hide of the app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
obsbot-core.workspace = true
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
nix = { version = "0.29", features = ["signal"] }
