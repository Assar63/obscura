# OBSBOT Tiny 2 (3564:fef8).
#
# It inherits tiny-se.toml's bindings, and that's better grounded than a
# guess: cgevans/tiny2 (https://github.com/cgevans/tiny2), an
# independent from-scratch reverse-engineering of this exact model (real
# USB captures, golden test vectors, no OBSBOT code), uses the identical
# CRC-16/USB framed-command envelope this project's protocol.rs implements,
# and several identical command/tag IDs: selector-6 tags mirror 0x14,
# ai_mode 0x16, suspend_time 0x0b, mic_during_sleep 0x13, hdr 0x01, face_ae
# 0x03; framed commands sleep/wake 0xc2a0 and gimbal velocity 0x8464, both
# on the matching dst/receiver bytes. OBSBOT's own SDK (bundled in
# https://github.com/aaronsb/obsbot-camera-control) also groups this model
# with Tiny SE under one status-block struct internally. The commands that
# don't overlap with cgevans' project (gestures, presets, HDR/AE/AF modes,
# audio) are still an assumption pending direct captures of this model; see
# "Adding support for another camera" in README.md.

id = "tiny-2"
name = "OBSBOT Tiny 2"
inherits = "tiny-se"

[[match]]
vendor_id = 0x3564
product_id = 0xfef8
