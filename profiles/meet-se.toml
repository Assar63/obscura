# OBSBOT Meet SE (3564:fefe).
#
# UNVERIFIED and deliberately partial: no USB captures or independent
# implementation exist for this model. Non-gimbal bindings below are
# copied from tiny-se.toml: OBSBOT's own SDK (bundled in
# https://github.com/aaronsb/obsbot-camera-control) groups Meet SE with
# Tiny, Tiny 4K, Tiny 2 (+ Lite) and Tiny SE under one status-block struct
# internally (a *different* struct than plain Meet/Meet 4K use), and
# cgevans/tiny2's independent reverse-engineering of the Tiny 2 confirms
# several of the same command/tag IDs as the Tiny SE captures this project
# has (see tiny-2.toml). But the Meet line doesn't have the Tiny line's
# mechanical gimbal, so gimbal velocity, presets and gimbal reset/reverse
# are deliberately left unbound here rather than guessed -- everything
# else is still an assumption pending real captures. If you can capture
# this model's traffic, please correct this file and drop this notice; see
# "Adding support for another camera" in README.md.
#
# Image controls and focus are standard UVC controls (inherited from
# generic-uvc). AI and gesture features use the vendor protocol on
# Extension Unit 2 -- see docs/protocol.md.
#
# Vendor bindings:
#   frames = framed commands on selector 2 (dst module, 2-byte cmd, value encoding)
#   short  = short setting on selector 6: [id, len, value]
#   status = byte offset in the selector 6 status block used for readback

id = "meet-se"
name = "OBSBOT Meet SE"
inherits = "generic-uvc"

# Firmware version and serial number via system module queries.
system_info = true

[[match]]
vendor_id = 0x3564
product_id = 0xfefe

# Standard control overrides. The Tiny SE's exposure_auto menu is
# 0 = Auto Mode, 1 = Manual (not the usual 3 = Aperture Priority).
[features.auto_exposure]
v4l2 = 0x009a0901
map = [[1, 0], [0, 1]]

# Gesture control: the master switch sends all four sub-switches.
# Readback: query dst 04 `0401` returns 12 bytes; [3] locked target, [4]
# zoom, [5] dynamic zoom, [6] direction flip, [7] zoom factor x10.
[features.gesture_control]
query = { dst = 0x04, cmd = "0401", offsets = [3, 4, 5, 6] }
frames = [
  { dst = 0x04, cmd = "c430" },
  { dst = 0x04, cmd = "4431" },
  { dst = 0x04, cmd = "4433" },
  { dst = 0x04, cmd = "c433" },
]

[features.gesture_locked_target]
query = { dst = 0x04, cmd = "0401", offsets = [3] }
frames = [{ dst = 0x04, cmd = "c430" }]

[features.gesture_zoom]
query = { dst = 0x04, cmd = "0401", offsets = [4] }
frames = [{ dst = 0x04, cmd = "4431" }]

[features.gesture_dynamic_zoom]
query = { dst = 0x04, cmd = "0401", offsets = [5] }
frames = [{ dst = 0x04, cmd = "4433" }]

[features.gesture_direction_flip]
query = { dst = 0x04, cmd = "0401", offsets = [6] }
frames = [{ dst = 0x04, cmd = "c433" }]

# Value is the factor x100 (100..400): the ISP gets it as u32 after a
# constant 02000000, the AI module as a float.
[features.gesture_zoom_factor]
query = { dst = 0x04, cmd = "0401", offsets = [7], scale = 10 }
frames = [
  { dst = 0x02, cmd = "4219", prefix = "02000000", value = "u32" },
  { dst = 0x04, cmd = "4432", value = "f32", divisor = 100 },
]

[features.mirror_image]
status = 19
short = { id = 0x14 }

# Manual zoom: ISP digital zoom, factor x100 (100..400) after a constant
# 02000000 (the same command the gesture zoom factor sends). Query 0468
# returns the current zoom as f32, including zoom from AI tracking.
[features.zoom]
query = { dst = 0x04, cmd = "0468", offsets = [0], value = "f32", scale = 100 }
frames = [{ dst = 0x02, cmd = "4219", prefix = "02000000", value = "u32" }]

# 0 off, 1 group, 2 human, 3 hand tracking
[features.ai_mode]
status = 24
# 6 is AiWorkModeSwitching in OBSBOT's SDK: a mode change in progress.
transient = [6]
short = { id = 0x16, value = "u16" }

# Sleep/resume: ISP u32, 1 sleep, 0 wake. status[2] is 1 while asleep.
[features.sleep]
status = 2
frames = [{ dst = 0x02, cmd = "c2a0", value = "u32" }]

# OBSBOT Center's AI lock is host-side: it turns AI tracking and gestures
# off, and unlocking restores the AI mode (not the gestures).
[features.ai_lock]
lock = { off = ["ai_mode", "gesture_control"], restore = ["ai_mode"] }

# Image
[features.hdr]
status = 6
short = { id = 0x01 }

# 0 Global, 1 Face
[features.auto_focus_mode]
status = 13
frames = [{ dst = 0x02, cmd = "0236", value = "u32" }]

# 0 Global, 1 Face
[features.auto_exposure_mode]
status = 7
short = { id = 0x03 }

# UVC backlight compensation 0..18 is -3..+3 EV in 1/3 steps.
[features.exposure_compensation]
v4l2 = 0x0098091c
offset = 9
scale = 3

# Audio
[features.mic_during_sleep]
status = 16
short = { id = 0x13 }

[features.noise_reduction]
status = 8
short = { id = 0x0a }

[features.auto_gain]
status = 25
short = { id = 0x17 }

# The camera value is 1 while the microphone is enabled; with 0 it
# re-enumerates on USB without its audio interface.
[features.disable_microphone]
status = 34
status_mask = 0x10
short = { id = 0x1c }
invert = true

[features.pickup_distance]
status = 34
status_mask = 0x0f
short = { id = 0x1b }

# Device sleep: one i16 setting in seconds, negated while auto sleep is off.
[features.auto_sleep]
status = 10
status_value = "i16"
short = { id = 0x0b, value = "u16" }
level = "sign-switch"
default_level = 30

[features.sleep_time]
status = 10
status_value = "i16"
short = { id = 0x0b, value = "u16" }
level = "magnitude"
default_level = 30

[features.sleep_background_mirror]
status = 29
short = { id = 0x0e, prefix = "02" }

# Status light: 0 off, 1..3 brightness.
[features.status_light]
status = 33
short = { id = 0x1a }
level = "switch"
default_level = 2

[features.status_light_brightness]
status = 33
short = { id = 0x1a }
level = "magnitude"
default_level = 2
