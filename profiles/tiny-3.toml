# OBSBOT Tiny 3 (3564:ff02).
#
# Bindings below are copied from tiny-se.toml. There are no USB captures of
# this model yet, but it was checked read-only on a Tiny 3 (bcdDevice 5.10):
# it exposes the same vendor Extension Unit (unit 2, GUID
# 9a1e7291-6843-4683-6d92-39bc7906ee49, 60-byte selectors), and its
# selector 6 status block matches the Tiny SE layout -- [9] 1 while awake,
# [10..12] sleep time 120 s, [14] AF on, [24] AI mode, [31] 0x1e while
# awake, [33] status light 0..3, [34] 0x10 with the microphone enabled. Its
# exposure_auto menu is 0 = Auto Mode, 1 = Manual, like the Tiny SE's, and
# UVC pan/tilt span the same ±130°/±90°.
#
# Tested from Linux on firmware 6.6.8.3, set and read back: mirror, status
# light, HDR, AI mode, AF mode, sleep/resume, manual zoom (the camera ramps
# it at about 0.2x per second), joystick and re-center (gimbal position
# query `0466`), the firmware/serial queries, and the gesture switches.
# Presets differ from the Tiny SE and are left unbound; the audio and
# device-sleep settings read back sensibly but haven't been written. See
# "Adding support for another camera" in README.md.
#
# Image controls, pan/tilt/zoom and focus are standard UVC controls
# (inherited from generic-uvc). AI and gesture features use the vendor
# protocol on Extension Unit 2 -- see docs/protocol.md.
#
# Vendor bindings:
#   frames = framed commands on selector 2 (dst module, 2-byte cmd, value encoding)
#   short  = short setting on selector 6: [id, len, value]
#   status = byte offset in the selector 6 status block used for readback

id = "tiny-3"
name = "OBSBOT Tiny 3"
inherits = "generic-uvc"

# Firmware version and serial number via system module queries.
system_info = true

[[match]]
vendor_id = 0x3564
product_id = 0xff02

# No [presets]: the preset list query (dst 04 `043b`) gets no response on
# the Tiny 3, so the Tiny SE's preset commands aren't used here.

# Joystick: [roll, pitch, yaw] float32 velocity, resent ~10 Hz, zeros to stop.
# Seen in OBSBOT Center captures with magnitudes up to ~8.5. Positive yaw
# turns the view right; positive pitch tilts it down, so "up" is negated
# (OBSBOT Center sends negative pitch for joystick up).
[gimbal_velocity]
dst = 0x04
cmd = "8464"
max_speed = 10.0
pitch_sign = -1.0

# Standard control overrides. The Tiny SE's exposure_auto menu is
# 0 = Auto Mode, 1 = Manual (not the usual 3 = Aperture Priority).
[features.auto_exposure]
v4l2 = 0x009a0901
map = [[1, 0], [0, 1]]

# Gesture control: one command for every gesture setting, unlike the Tiny
# SE's command per switch (which the Tiny 3 accepts and ignores). Write dst
# 04 `4434` with a u32 setting type then the value; read with query `8434`
# (flags 0x21) and the u32 type as payload, which answers u8 (switches) or
# f32 (zoom factor). Types: 0 master, 1 target selection (palm: tracking
# on/off), 2 zoom ("L": 2x in/out), 3 dynamic zoom, 8 zoom factor. Seen in
# the traffic of OBSBOT's SDK (libdev 2.1.0) and confirmed on the camera:
# with type 1 or 2 off, that gesture is ignored. Switching the master off
# also turns the gestures off, and switching it on doesn't bring them back,
# so the master sends all four.
[features.gesture_control]
query = { dst = 0x04, cmd = "8434", flags = 0x21, payload = "00000000", offsets = [0] }
frames = [
  { dst = 0x04, cmd = "4434", prefix = "00000000" },
  { dst = 0x04, cmd = "4434", prefix = "01000000" },
  { dst = 0x04, cmd = "4434", prefix = "02000000" },
  { dst = 0x04, cmd = "4434", prefix = "03000000" },
]

[features.gesture_locked_target]
query = { dst = 0x04, cmd = "8434", flags = 0x21, payload = "01000000", offsets = [0] }
frames = [{ dst = 0x04, cmd = "4434", prefix = "01000000" }]

[features.gesture_zoom]
query = { dst = 0x04, cmd = "8434", flags = 0x21, payload = "02000000", offsets = [0] }
frames = [{ dst = 0x04, cmd = "4434", prefix = "02000000" }]

[features.gesture_dynamic_zoom]
query = { dst = 0x04, cmd = "8434", flags = 0x21, payload = "03000000", offsets = [0] }
frames = [{ dst = 0x04, cmd = "4434", prefix = "03000000" }]

# Value is the factor x100 (100..400); the camera takes and returns a float.
[features.gesture_zoom_factor]
query = { dst = 0x04, cmd = "8434", flags = 0x21, payload = "08000000", offsets = [0], value = "f32", scale = 100 }
frames = [{ dst = 0x04, cmd = "4434", prefix = "08000000", value = "f32", divisor = 100 }]

[features.mirror_image]
status = 19
short = { id = 0x14 }

# Manual zoom: ISP digital zoom, factor x100 (100..400) after a constant
# 02000000 (the same command the gesture zoom factor sends). Query 0468
# returns the current zoom as f32, including zoom from AI tracking.
[features.zoom]
query = { dst = 0x04, cmd = "0468", offsets = [0], value = "f32", scale = 100 }
frames = [{ dst = 0x02, cmd = "4219", prefix = "02000000", value = "u32" }]

# Re-center, as OBSBOT Center's View & Gimbal reset icon does: a query
# (8438, payload 01) then 0439 with flags 0x05. Writing UVC pan/tilt 0
# doesn't move the gimbal back after velocity moves.
[features.gimbal_reset]
frames = [
  { dst = 0x04, cmd = "8438", flags = 0x01, payload = "01" },
  { dst = 0x04, cmd = "0439", flags = 0x05, payload = "" },
]

# View and gimbal reverse (upside-down mounting). No readback seen.
[features.gimbal_reverse]
frames = [{ dst = 0x04, cmd = "843b" }]

# 0 off, 1 group, 2 human, 3 hand tracking
[features.ai_mode]
status = 24
# 6 is AiWorkModeSwitching in OBSBOT's SDK: a mode change in progress.
transient = [6]
short = { id = 0x16, value = "u16" }

# Sleep/resume: ISP u32, 1 sleep, 0 wake. status[2] is 1 while asleep.
[features.sleep]
status = 2
frames = [{ dst = 0x02, cmd = "c2a0", value = "u32" }]

# OBSBOT Center's AI lock is host-side: it turns AI tracking and gestures
# off, and unlocking restores the AI mode (not the gestures).
[features.ai_lock]
lock = { off = ["ai_mode", "gesture_control"], restore = ["ai_mode"] }

# Image
[features.hdr]
status = 6
short = { id = 0x01 }

# 0 Global, 1 Face
[features.auto_focus_mode]
status = 13
frames = [{ dst = 0x02, cmd = "0236", value = "u32" }]

# 0 Global, 1 Face
[features.auto_exposure_mode]
status = 7
short = { id = 0x03 }

# UVC backlight compensation 0..18 is -3..+3 EV in 1/3 steps.
[features.exposure_compensation]
v4l2 = 0x0098091c
offset = 9
scale = 3

# Audio
[features.mic_during_sleep]
status = 16
short = { id = 0x13 }

[features.noise_reduction]
status = 8
short = { id = 0x0a }

[features.auto_gain]
status = 25
short = { id = 0x17 }

# The camera value is 1 while the microphone is enabled; with 0 it
# re-enumerates on USB without its audio interface.
[features.disable_microphone]
status = 34
status_mask = 0x10
short = { id = 0x1c }
invert = true

[features.pickup_distance]
status = 34
status_mask = 0x0f
short = { id = 0x1b }

# Device sleep: one i16 setting in seconds, negated while auto sleep is off.
[features.auto_sleep]
status = 10
status_value = "i16"
short = { id = 0x0b, value = "u16" }
level = "sign-switch"
default_level = 30

[features.sleep_time]
status = 10
status_value = "i16"
short = { id = 0x0b, value = "u16" }
level = "magnitude"
default_level = 30

[features.sleep_background_mirror]
status = 29
short = { id = 0x0e, prefix = "02" }

# Status light. Unlike the Tiny SE, writing 0 keeps the brightness at [33]
# and clears led_enable at [45]; writing 1..3 sets the brightness and
# switches it on again. Measured on the camera.
[features.status_light]
status = 45
short = { id = 0x1a }
level = "switch"
level_status = 33
default_level = 2

[features.status_light_brightness]
status = 33
short = { id = 0x1a }
level = "magnitude"
default_level = 2
