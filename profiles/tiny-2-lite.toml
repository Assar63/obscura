# OBSBOT Tiny 2 Lite (3564:fef9).
#
# UNVERIFIED for this exact model: no USB captures of a Tiny 2 Lite exist
# yet. It inherits tiny-se.toml's bindings on the assumption that
# OBSBOT's Tiny-series gimbal cameras share the vendor protocol -- an
# assumption with real evidence behind it, not just a guess: OBSBOT's own
# SDK (bundled in https://github.com/aaronsb/obsbot-camera-control) groups
# Tiny, Tiny 4K, Tiny 2 (+ Lite), Tiny SE, Meet 2 and Meet SE under one
# status-block struct internally, and cgevans/tiny2
# (https://github.com/cgevans/tiny2), an independent from-scratch
# reverse-engineering of the plain Tiny 2, uses the identical CRC-16/USB
# framed-command envelope and several identical command/tag IDs (selector-6
# tags: mirror 0x14, ai_mode 0x16, suspend_time 0x0b, mic_during_sleep
# 0x13, hdr 0x01, face_ae 0x03; framed commands: sleep/wake 0xc2a0, gimbal
# velocity 0x8464 -- all on the matching dst/receiver bytes). Still: this
# is the Lite variant specifically, which nobody has captured. If you can,
# please correct this file and drop this notice; see "Adding support for
# another camera" in README.md.

id = "tiny-2-lite"
name = "OBSBOT Tiny 2 Lite"
inherits = "tiny-se"

[[match]]
vendor_id = 0x3564
product_id = 0xfef9
