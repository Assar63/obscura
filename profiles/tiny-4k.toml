# OBSBOT Tiny 4K (3564:fef4).
#
# UNVERIFIED for this exact model: no USB captures or independent
# implementation exist for the Tiny 4K specifically. It inherits
# tiny-se.toml's bindings on the assumption that OBSBOT's Tiny-series gimbal
# cameras share the vendor protocol. That assumption has real evidence
# behind it for the family as a whole (see tiny-2.toml's header for the
# cross-check against cgevans/tiny2), and OBSBOT's own SDK (bundled in
# https://github.com/aaronsb/obsbot-camera-control) explicitly groups
# Tiny, Tiny 4K, Tiny 2 (+ Lite), Tiny SE, Meet 2 and Meet SE under one
# status-block struct internally -- but nobody has captured a Tiny 4K's
# traffic to confirm the command IDs match here too. If you can, please
# correct this file and drop this notice; see "Adding support for another
# camera" in README.md.

id = "tiny-4k"
name = "OBSBOT Tiny 4K"
inherits = "tiny-se"

[[match]]
vendor_id = 0x3564
product_id = 0xfef4
